<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nemesis</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 52px;
            margin-bottom: 12px;
        }

        p {
            color: #aaa;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .discord {
            display: inline-block;
            padding: 14px 26px;
            background: #5865F2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            transition: 0.2s;
        }

        .discord:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Nemesis</h1>
        <p>Welcome to the official Nemesis website.</p>

        <a
            class="discord"
            href="https://discord.gg/ArchHubxyz"
            target="_blank"
            rel="noopener noreferrer"
        >
            Join our Discord
        </a>
    </main>
</body>
</html>
